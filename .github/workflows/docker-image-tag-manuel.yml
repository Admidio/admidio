name: Docker Multi-Arch Build on Manual Tag

on:
  workflow_dispatch:
    inputs:
      git_tag:
        description: 'Git Tag (z. B. v5.0.3)'
        required: true
      latest:
        description: 'Also set the latest tag (newest release line only, not for betas or older versions)'
        type: boolean
        default: true

jobs:
  build:
    if: ${{ github.repository_owner == 'Admidio' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source at tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.git_tag }}
          fetch-depth: 0

      # Docker tags are created without the "v" prefix of the git tag:
      # v5.0.19 -> 5.0.19 (exact version) and 5.0 (newest 5.0.x)
      # Pre-releases and tags that are not semver (e.g. v5.0-Beta.3) only get their exact version.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: admidio/admidio
          flavor: latest=false
          tags: |
            type=match,pattern=^v?(.+)$,group=1,value=${{ inputs.git_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.git_tag }}
            type=raw,value=latest,enable=${{ inputs.latest }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
