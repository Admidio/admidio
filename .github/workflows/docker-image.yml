name: Docker Multi-Arch Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    if: ${{ github.repository_owner == 'Admidio' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      # Docker tags are created without the "v" prefix of the git tag:
      # v5.0.19 -> 5.0.19 (exact version) and 5.0 (newest 5.0.x)
      # Pre-releases and tags that are not semver (e.g. v5.0-Beta.3) only get their exact version.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: admidio/admidio
          flavor: latest=false
          tags: |
            type=match,pattern=^v?(.+)$,group=1
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
