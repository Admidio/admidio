name: Regression Tests

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'system/**'
      - 'modules/**'
      - 'install/**'
      - 'tests/**'
      - 'admidio'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml'
      - '.github/workflows/regression-tests.yml'
  push:
    branches: [ master ]
  schedule:
    # Run on schedule for MySQL (third database)
    - cron: '0 2 * * MON'
  workflow_dispatch:
    inputs:
      database:
        description: 'Database engine to test'
        required: false
        default: 'all'
        type: choice
        options:
          - mariadb
          - postgres
          - mysql
          - all

concurrency:
  group: regression-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.2'
  # the suite refuses to run unless database and file path are marked as a test environment
  TEST_FILES_PATH: ./tests/adm_my_files

defaults:
  run:
    shell: bash

jobs:
  fast-checks:
    name: Fast Checks
    runs-on: ubuntu-latest
    env:
      # the unit tests need no database, but the bootstrap still wants to know what a run would use
      TEST_DATABASE_ENGINE: mariadb
      TEST_DB_MARIADB_NAME: admidio_test
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: curl, gd, iconv, json, pdo, posix, simplexml, zip
          coverage: none

      - name: Check PHP syntax
        run: |
          if ! find src system modules install tests -name '*.php' -print0 \
              | xargs -0 -n1 -P4 php -l > syntax-check.log 2>&1; then
            grep -v '^No syntax errors detected' syntax-check.log
            exit 1
          fi

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run unit tests
        run: composer test:unit

  mariadb:
    name: MariaDB 10.11
    needs: fast-checks
    if: github.event.inputs.database == '' || github.event.inputs.database == 'mariadb' || github.event.inputs.database == 'all'
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_ENGINE: mariadb
      TEST_DB_MARIADB_HOST: 127.0.0.1
      TEST_DB_MARIADB_PORT: 3306
      TEST_DB_MARIADB_USER: admidio
      TEST_DB_MARIADB_PASS: admidio_test
      TEST_DB_MARIADB_NAME: admidio_test
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: admidio_test
          MARIADB_USER: admidio
          MARIADB_PASSWORD: admidio_test
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: curl, gd, iconv, json, pdo, pdo_mysql, posix, simplexml, zip
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare test environment
        run: php tests/bin/setup-test-env.php

      - name: Run integration tests
        run: composer test:integration

      - name: Run CLI tests
        run: composer test:cli

  postgres:
    name: PostgreSQL 15
    needs: fast-checks
    if: github.event.inputs.database == '' || github.event.inputs.database == 'postgres' || github.event.inputs.database == 'all'
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_ENGINE: postgres
      TEST_DB_POSTGRES_HOST: 127.0.0.1
      TEST_DB_POSTGRES_PORT: 5432
      TEST_DB_POSTGRES_USER: admidio
      TEST_DB_POSTGRES_PASS: admidio_test
      TEST_DB_POSTGRES_NAME: admidio_test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: admidio_test
          POSTGRES_USER: admidio
          POSTGRES_PASSWORD: admidio_test
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: curl, gd, iconv, json, pdo, pdo_pgsql, posix, simplexml, zip
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare test environment
        run: php tests/bin/setup-test-env.php

      - name: Run integration tests
        run: composer test:integration

      - name: Run CLI tests
        run: composer test:cli

  mysql:
    name: MySQL 8.0
    needs: fast-checks
    if: github.event_name == 'schedule' || github.event.inputs.database == 'mysql' || github.event.inputs.database == 'all'
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_ENGINE: mysql
      TEST_DB_MYSQL_HOST: 127.0.0.1
      TEST_DB_MYSQL_PORT: 3306
      TEST_DB_MYSQL_USER: admidio
      TEST_DB_MYSQL_PASS: admidio_test
      TEST_DB_MYSQL_NAME: admidio_test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: admidio_test
          MYSQL_USER: admidio
          MYSQL_PASSWORD: admidio_test
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: curl, gd, iconv, json, pdo, pdo_mysql, posix, simplexml, zip
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare test environment
        run: php tests/bin/setup-test-env.php

      - name: Run integration tests
        run: composer test:integration

      - name: Run CLI tests
        run: composer test:cli
